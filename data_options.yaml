export_trc: true
data_processing:
  low_pass_filter:
    enable: true
    cutoff: 6
    order: 4
  jump_filtering:
    enable: true
    smooth_process_noise:
      opposite_arm: 1
      motion_arm: 10
      center: 10
    smooth_measurement_noise:
      opposite_arm: 0.0001
      motion_arm: 1.0e-05
      center: 0.01
    smooth_nis_threshold:
      opposite_arm: 10
      motion_arm: 40
      center: 5
    save_plot: true
motion_segmentation:
  threshold_onset: 0.1
  threshold_drinking: 0.15
  threshold_transporting: 0.1
CNN_model:
  mode: balanced
  device: cuda
  backend: onnxruntime
  save_annotated_images: false
projection:
  clusters:
    thorax:
    - - thx_r
      - thx_l
      - thx_d
    - - ster
      - xiph
      - c7
      - t10
      - ribs_r
      - ribs_l
      - clav_sc_r
      - clav_sc_l
    arm_r:
    - - hum_a_r
      - hum_p_r
      - hum_d_r
    - - epic_m_r
      - epic_lat_r
    arm_l:
    - - hum_a_l
      - hum_p_l
      - hum_d_l
    - - epic_m_l
      - epic_lat_l
  replace_existing: false
fill_gaps:
  enable: true
  threshold: 10
events:
  cut: true
  names:
  - Start
  - Stop
  replace_existing: false
